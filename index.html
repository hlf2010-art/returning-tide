<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>回潮 Returning Tide</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/src/ui/style.css" />
</head>
<body>
  <canvas id="view"></canvas>

  <div id="hud" class="hidden">
    <div id="reticle"></div>
    <div id="prompt"><kbd id="prompt-key">E</kbd><span id="prompt-target"></span><span id="prompt-text"></span><span id="prompt-talk" style="display:none"><kbd>T</kbd><span></span></span></div>
    <div id="place"><div class="kicker"><span class="neon"></span><span data-t="placeSub"></span></div><div class="name" data-t="place"></div></div>
    <div id="toast"></div>
    <div id="thought"></div>
    <div id="subtitle" aria-live="polite">
      <div id="sub-meta"><span id="sub-speaker"></span><span id="sub-source"></span></div>
      <div id="sub-text"></div>
      <div id="sub-choices">
        <div id="sub-options" class="hidden"></div>
        <div id="sub-exit" class="hidden"><kbd>E</kbd> <span data-t="stepBack"></span></div>
      </div>
    </div>
    <div id="minimap" aria-hidden="true"></div>
    <div id="bark" aria-live="polite"><span id="bark-who"></span><span id="bark-text"></span><span id="bark-gloss"></span></div>
    <div id="objective" class="hidden" aria-live="polite">
      <div class="m-head"><span class="m-num" data-t="m1Num"></span><span class="m-title" data-t="m1Title"></span></div>
      <div class="m-step" id="m-step"></div>
      <div class="m-hint hidden" id="m-hint"></div>
    </div>
    <div id="mission-card" aria-live="polite">
      <div class="mc-kicker"><span data-t="m1Num"></span> · <span data-t="m1Done"></span></div>
      <div class="mc-title" data-t="m1Title"></div>
      <div class="mc-outcome" id="mc-outcome"></div>
    </div>
    <div id="dev" class="hidden">DEV · <b>F7</b> weather · <b>F8</b> start Mission One · <b>F9</b> reset</div>
    <div id="keys"></div>
  </div>

  <div id="inspect" class="hidden">
    <div id="inspect-paper"></div>
    <aside id="inspect-aside">
    </aside>
  </div>

  <div id="pouch" class="hidden">
    <div id="pouch-paper"></div>
    <aside>
      <h2 id="pouch-h"></h2>
      <div id="pouch-body"></div>
      <div class="choices" id="pouch-options"></div>
      <div class="hint" id="pouch-hint"></div>
      <div class="close" id="pouch-esc"></div>
    </aside>
  </div>

  <div id="pause" class="hidden">
    <div class="menu-col">
      <div class="kicker"><span class="neon"></span><span data-t="place"></span></div>
      <h1 data-t="paused"></h1>
      <button id="resume" class="mbtn primary" data-ico="play" data-t="resume"></button>
      <button class="mbtn" data-ico="gear" data-open-settings data-t="settings"></button>
      <button class="mbtn" data-ico="folder" data-open-saves data-t="saves"></button>
      <button class="mbtn" data-ico="keyboard" data-open-controls data-t="controls"></button>
    </div>
  </div>

  <div id="settings" class="hidden" role="dialog" aria-modal="true">
    <div class="panel">
      <div class="ph"><span data-t="settings"></span><button class="x" data-close-settings aria-label="close">✕</button></div>
      <div class="tabs" id="set-tabs"><button data-tab="general" class="on ico-only" data-ico="gear" title="General · 通用" data-t="tabGeneral"></button><button data-tab="graphics" class="ico-only" data-ico="monitor" title="Graphics · 画面" data-t="tabGraphics"></button></div>
      <div class="tab-body" data-body="graphics" hidden>
        <div class="row"><span data-t="gPreset"></span><div class="seg" data-setting="g.preset"><button data-v="low" data-t="gLow"></button><button data-v="mac" data-t="gMac"></button><button data-v="high" data-t="gHigh"></button><button data-v="ultra" data-t="gUltra"></button><button data-v="custom" data-t="gCustom" disabled></button></div></div>
        <div class="row"><span data-t="gScale"></span><div class="slide"><input type="range" id="g-scale" min="50" max="150" step="5"><output id="g-scale-v"></output></div></div>
        <div class="row"><span data-t="gFps"></span><div class="seg" data-setting="g.fps"><button data-v="30">30</button><button data-v="60">60</button><button data-v="120">120</button><button data-v="0" data-t="gNoCap"></button></div></div>
        <div class="row"><span data-t="gLod"></span><div class="seg" data-setting="g.lod"><button data-v="low" data-t="gLow"></button><button data-v="medium" data-t="gMedium"></button><button data-v="high" data-t="gHigh"></button><button data-v="ultra" data-t="gUltra"></button></div></div>
        <div class="row"><span data-t="gCrowd"></span><div class="seg" data-setting="crowd"><button data-v="low" data-t="gLow"></button><button data-v="medium" data-t="gMedium"></button><button data-v="high" data-t="gHigh"></button></div></div>
        <div class="row"><span data-t="gLighting"></span><div class="seg" data-setting="lighting"><button data-v="low" data-t="gLow"></button><button data-v="medium" data-t="gMedium"></button><button data-v="high" data-t="gHigh"></button></div></div>
        <div class="row g-reload" hidden><span data-t="gReload"></span><button class="mbtn small" id="g-reload" data-t="gReloadNow"></button></div>
        <div class="row"><span data-t="gAA"></span><div class="seg" data-setting="g.msaa"><button data-v="0">SMAA</button><button data-v="2">MSAA 2×</button><button data-v="4">MSAA 4×</button></div></div>
        <div class="row"><span data-t="gShadows"></span><div class="seg" data-setting="g.shadows"><button data-v="0" data-t="off"></button><button data-v="1">1</button><button data-v="2">2</button></div></div>
        <div class="row"><span data-t="gAO"></span><div class="seg" data-setting="g.ao"><button data-v="1" data-t="on"></button><button data-v="0" data-t="off"></button></div></div>
        <div class="row"><span data-t="gSSR"></span><div class="seg" data-setting="g.ssr"><button data-v="1" data-t="on"></button><button data-v="0" data-t="off"></button></div></div>
        <div class="row"><span data-t="gRefl"></span><div class="seg" data-setting="g.refl"><button data-v="1" data-t="on"></button><button data-v="0" data-t="off"></button></div></div>
        <div class="row"><span data-t="gBloom"></span><div class="seg" data-setting="g.bloom"><button data-v="1" data-t="on"></button><button data-v="0" data-t="off"></button></div></div>
        <div class="row"><span data-t="gMirror"></span><div class="seg" data-setting="g.mirror"><button data-v="512">512</button><button data-v="768">768</button><button data-v="1024">1K</button><button data-v="2048">2K</button></div></div>
        <div class="row"><span data-t="gAuto"></span><div class="seg" data-setting="g.auto"><button data-v="1" data-t="on"></button><button data-v="0" data-t="off"></button></div></div>
        <div class="row"><span data-t="benchmark"></span><button class="mbtn" id="bench-run" data-t="benchRun"></button></div>
        <div class="ai-status" id="bench-out"></div>
        <div class="ai-status" id="g-status"></div>
        <div class="ai-status" data-t="gHint"></div>
      </div>
      <div class="tab-body" data-body="general">
      <div class="row"><span data-t="language"></span><div class="seg" data-setting="lang"><button data-v="zh">中文</button><button data-v="en">English</button></div></div>
      <div class="row"><span data-t="subtitles"></span><div class="seg" data-setting="subs"><button data-v="on" data-t="on"></button><button data-v="off" data-t="off"></button></div></div>
      <div class="row"><span data-t="sound"></span><div class="seg" data-setting="sound"><button data-v="on" data-t="on"></button><button data-v="off" data-t="off"></button></div></div>
      <div class="row"><span data-t="tipsSetting"></span><div class="seg" data-setting="tips"><button data-v="on" data-t="on"></button><button data-v="off" data-t="off"></button></div></div>
      <div class="row"><span data-t="musicSetting"></span><div class="seg" data-setting="music"><button data-v="on" data-t="on"></button><button data-v="off" data-t="off"></button></div></div>
      <details class="credits" id="music-credits"><summary data-t="musicCredits"></summary><ul></ul></details>
      <details class="credits" id="credits"><summary data-t="credits"></summary><ul></ul></details>
      <div class="row"><span data-t="voices"></span><div class="seg" data-setting="voices"><button data-v="original" data-t="voicesOriginal"></button><button data-v="dubbed" data-t="voicesDubbed"></button></div></div>
      <div class="row"><span data-t="ai"></span><div class="seg" data-setting="ai"><button data-v="auto" data-t="aiAuto"></button><button data-v="browser" data-t="aiBrowser"></button><button data-v="off" data-t="off"></button></div></div>
      <div class="row"><span data-t="voiceServer"></span><div class="seg" data-setting="voiceServer"><button data-v="off" data-t="voiceServerOff"></button><button data-v="server" data-t="voiceServerLocal"></button></div></div>
      <div class="row ai-adv"><span data-t="aiServer"></span><input id="ai-server" spellcheck="false"><input id="ai-model" spellcheck="false"></div>
      <div class="ai-status" id="ai-status"></div>
      </div>
    </div>
  </div>

  <div id="entry" class="loading">
    <!-- the Bund at blue hour, painted; glints, lamps and the Pearl drawn live on top (ui/titleScreen.js) -->
    <div class="backdrop" aria-hidden="true"><div class="bd-pan"><img class="bd-img" src="/title/bund-night.webp" alt="" decoding="async" fetchpriority="high"><canvas id="entry-fx"></canvas></div></div>
    <div class="topbar"><div class="seg lang-quick" data-setting="lang"><button data-v="zh">中文</button><button data-v="en">EN</button></div></div>
    <div class="stage">
      <div class="hero">
        <h1 class="logo" data-t="title"></h1>
        <svg class="swoosh" viewBox="0 0 1000 60" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="sw-grad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0">
              <stop offset="0" stop-color="#f6d9a2" stop-opacity="0"/>
              <stop offset="0.3" stop-color="#e9b96f" stop-opacity="0.55"/>
              <stop offset="0.56" stop-color="#fff4e2" stop-opacity="1"/>
              <stop offset="0.8" stop-color="#e9b96f" stop-opacity="0.5"/>
              <stop offset="1" stop-color="#f6d9a2" stop-opacity="0"/>
            </linearGradient>
            <radialGradient id="sw-flare-g"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="0.25" stop-color="#ffd9a0" stop-opacity="0.7"/><stop offset="1" stop-color="#e9a25a" stop-opacity="0"/></radialGradient>
            <filter id="sw-blur" x="-10%" y="-200%" width="120%" height="500%"><feGaussianBlur stdDeviation="3"/></filter>
          </defs>
          <path class="sw-glow" pathLength="1" d="M10,40 C200,22 380,30 520,40 C640,48 760,26 990,18" filter="url(#sw-blur)"/>
          <path class="sw-line" pathLength="1" d="M10,40 C200,22 380,30 520,40 C640,48 760,26 990,18"/>
          <ellipse class="sw-flare" cx="10" cy="40" rx="70" ry="7" fill="url(#sw-flare-g)"/>
        </svg>
        <div class="hero-sub" aria-hidden="true"><span class="alt-zh">回潮</span><span class="alt-en">Returning Tide</span></div>
        <div class="load" role="status"><span data-t="loading"></span><span class="pct" id="load-pct">0%</span></div>
      </div>
      <div class="card">
        <div class="chapter" data-t="chapter"></div>
        <p class="tagline" data-t="tagline"></p>
        <p class="premise" data-t="premise"></p>
        <div class="actions">
          <button id="begin" class="mbtn primary" disabled data-t="loading"></button>
          <button id="new-game" class="mbtn" style="display:none"></button>
          <button class="mbtn" data-open-settings data-t="settings"></button>
          <button class="mbtn" data-open-controls data-t="controls"></button>
        </div>
      </div>
    </div>
    <div class="cityline"><span class="geo">31.2397° N&nbsp;&nbsp;121.4906° E</span><span data-t="district"></span><span data-t="weatherNow"></span><span id="entry-time"></span></div>
  </div>
  <!-- a DiDi ride: the drive on beyond the Bund, what's said in the car, getting there -->
  <div id="ride-interlude"><div class="streaks"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
  <div id="ride-sub"><div class="sp"></div><div class="tx"></div><div class="ch hidden"></div></div>
  <div id="ride-card"><div class="kicker"><span class="neon"></span><span data-t="rideArrived"></span></div><div class="place"></div><div class="line"></div><div class="fare"></div><div class="back"></div><button class="mbtn primary go"></button></div>
  <script>
    // If this browser can't run the game (no WebGL2, or JavaScript too old), say so instead of a blank page.
    (function () {
      var shown = false;
      function tell(why) {
        if (shown) return; shown = true;
        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#0b0f1a;color:#e8e2d4;font:16px/1.6 -apple-system,system-ui,sans-serif;padding:24px;text-align:center';
        d.innerHTML = '<div style="max-width:520px"><div style="font-size:26px;margin-bottom:12px">回潮 Returning Tide</div>' +
          '<p>这个浏览器打不开游戏（' + why + '）。请更新 Safari（macOS 系统更新），或改用 Chrome / Edge。</p>' +
          '<p style="opacity:.8">This browser can\'t run the game (' + why + '). Please update Safari (through a macOS update), or use Chrome or Edge.</p></div>';
        document.body.appendChild(d);
      }
      var c = document.createElement('canvas'), gl = null;
      try { gl = c.getContext('webgl2'); } catch (e) {}
      if (!gl) document.addEventListener('DOMContentLoaded', function () { tell('no WebGL2'); });
      window.addEventListener('error', function (e) { if (e && e.error instanceof SyntaxError || /SyntaxError|Unexpected/.test(e && e.message || '')) tell('JavaScript too old'); });
    })();
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
