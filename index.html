<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>回潮 Returning Tide</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/src/ui/style.css" />
</head>
<body>
  <canvas id="view"></canvas>

  <div id="hud" class="hidden">
    <div id="reticle"></div>
    <div id="prompt"><kbd id="prompt-key">E</kbd><span id="prompt-target"></span><span id="prompt-text"></span><span id="prompt-talk" style="display:none"><kbd>T</kbd><span></span></span></div>
    <div id="place"><div class="kicker"><span class="neon"></span><span data-t="placeSub"></span></div><div class="name" data-t="place"></div></div>
    <div id="toast"></div>
    <div id="thought"></div>
    <div id="subtitle" aria-live="polite">
      <div id="sub-meta"><span id="sub-speaker"></span><span id="sub-source"></span></div>
      <div id="sub-text"></div>
      <div id="sub-choices">
        <div id="sub-options" class="hidden"></div>
        <div id="sub-exit" class="hidden"><kbd>E</kbd> <span data-t="stepBack"></span></div>
      </div>
    </div>
    <div id="minimap" aria-hidden="true"></div>
    <div id="bark" aria-live="polite"><span id="bark-who"></span><span id="bark-text"></span><span id="bark-gloss"></span></div>
    <div id="objective" class="hidden" aria-live="polite">
      <div class="m-head"><span class="m-num" data-t="m1Num"></span><span class="m-title" data-t="m1Title"></span></div>
      <div class="m-step" id="m-step"></div>
      <div class="m-hint hidden" id="m-hint"></div>
    </div>
    <div id="mission-card" aria-live="polite">
      <div class="mc-kicker"><span data-t="m1Num"></span> · <span data-t="m1Done"></span></div>
      <div class="mc-title" data-t="m1Title"></div>
      <div class="mc-outcome" id="mc-outcome"></div>
    </div>
    <div id="dev" class="hidden">DEV · <b>F7</b> weather · <b>F8</b> start Mission One · <b>F9</b> reset</div>
    <div id="keys"></div>
  </div>

  <div id="inspect" class="hidden">
    <div id="inspect-paper"></div>
    <aside id="inspect-aside">
    </aside>
  </div>

  <div id="pouch" class="hidden">
    <div id="pouch-paper"></div>
    <aside>
      <h2 id="pouch-h"></h2>
      <div id="pouch-body"></div>
      <div class="choices" id="pouch-options"></div>
      <div class="hint" id="pouch-hint"></div>
      <div class="close" id="pouch-esc"></div>
    </aside>
  </div>

  <div id="pause" class="hidden">
    <div class="menu-col">
      <div class="kicker"><span class="neon"></span><span data-t="place"></span></div>
      <h1 data-t="paused"></h1>
      <button id="resume" class="mbtn primary" data-t="resume"></button>
      <button class="mbtn" data-open-settings data-t="settings"></button>
    </div>
  </div>

  <div id="settings" class="hidden" role="dialog" aria-modal="true">
    <div class="panel">
      <div class="ph"><span data-t="settings"></span><button class="x" data-close-settings aria-label="close">✕</button></div>
      <div class="row"><span data-t="language"></span><div class="seg" data-setting="lang"><button data-v="zh">中文</button><button data-v="en">English</button></div></div>
      <div class="row"><span data-t="subtitles"></span><div class="seg" data-setting="subs"><button data-v="on" data-t="on"></button><button data-v="off" data-t="off"></button></div></div>
      <div class="row"><span data-t="sound"></span><div class="seg" data-setting="sound"><button data-v="on" data-t="on"></button><button data-v="off" data-t="off"></button></div></div>
      <div class="row"><span data-t="voices"></span><div class="seg" data-setting="voices"><button data-v="original" data-t="voicesOriginal"></button><button data-v="dubbed" data-t="voicesDubbed"></button></div></div>
      <div class="row"><span data-t="ai"></span><div class="seg" data-setting="ai"><button data-v="auto" data-t="aiAuto"></button><button data-v="browser" data-t="aiBrowser"></button><button data-v="off" data-t="off"></button></div></div>
      <div class="row ai-adv"><span data-t="aiServer"></span><input id="ai-server" spellcheck="false"><input id="ai-model" spellcheck="false"></div>
      <div class="ai-status" id="ai-status"></div>
    </div>
  </div>

  <div id="entry">
    <div class="topbar"><div class="seg lang-quick" data-setting="lang"><button data-v="zh">中文</button><button data-v="en">EN</button></div></div>
    <div class="card">
      <div class="kicker"><span class="neon"></span><span data-t="kicker"></span></div>
      <h1 class="logo" data-t="title"></h1>
      <div class="chapter" data-t="chapter"></div>
      <p class="premise" data-t="premise"></p>
      <div class="actions">
        <button id="begin" class="mbtn primary" disabled data-t="loading"></button>
        <button class="mbtn" data-open-settings data-t="settings"></button>
      </div>
    </div>
    <div class="cityline"><span class="geo">31.2397° N&nbsp;&nbsp;121.4906° E</span><span data-t="district"></span><span data-t="weatherNow"></span><span id="entry-time"></span></div>
  </div>
  <!-- a DiDi ride: the drive on beyond the Bund, what's said in the car, getting there -->
  <div id="ride-interlude"><div class="streaks"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
  <div id="ride-sub"><div class="sp"></div><div class="tx"></div><div class="ch hidden"></div></div>
  <div id="ride-card"><div class="kicker"><span class="neon"></span><span data-t="rideArrived"></span></div><div class="place"></div><div class="line"></div><div class="fare"></div><div class="back"></div><button class="mbtn primary go"></button></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
